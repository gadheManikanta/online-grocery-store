<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FreshCart - Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #dff7df,
                    #fff3d6
                );
        }


        .login-container {

            width: 100%;

            max-width: 420px;

            background: white;

            padding: 40px 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.15);
        }


        .logo {

            text-align: center;

            font-size: 30px;

            font-weight: bold;

            color: #159447;

            margin-bottom: 10px;
        }


        .title {

            text-align: center;

            font-size: 26px;

            color: #222;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }


        .form-group {

            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;
        }


        .form-group input {

            width: 100%;

            padding: 14px;

            border: 1px solid #d5d5d5;

            border-radius: 8px;

            outline: none;

            font-size: 15px;
        }


        .form-group input:focus {

            border-color: #159447;

            box-shadow:
                0 0 5px
                rgba(21, 148, 71, 0.2);
        }


        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #159447;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .login-button:hover {

            background: #0e7536;
        }


        .message {

            text-align: center;

            margin-top: 15px;

            font-weight: bold;

            min-height: 20px;
        }


        .register-link {

            text-align: center;

            margin-top: 25px;

            color: #666;

            font-size: 14px;
        }


        .register-link a {

            color: #159447;

            font-weight: bold;

            text-decoration: none;
        }


        .register-link a:hover {

            text-decoration: underline;
        }


        .home-link {

            text-align: center;

            margin-top: 15px;
        }


        .home-link a {

            color: #555;

            text-decoration: none;

            font-size: 14px;
        }


        .home-link a:hover {

            color: #159447;
        }


        @media (max-width: 500px) {

            .login-container {

                padding: 30px 25px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <!-- LOGO -->

    <div class="logo">

        🛒 FreshCart

    </div>


    <!-- TITLE -->

    <h1 class="title">

        Welcome Back!

    </h1>


    <p class="subtitle">

        Login to continue shopping

    </p>


    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">

                Email Address

            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">

                Password

            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="login-button">

            🔐 Login

        </button>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">
        </div>


    </form>


    <!-- REGISTER LINK -->

    <div class="register-link">

        Don't have an account?

        <a href="register.html">

            Register Now

        </a>

    </div>


    <!-- HOME LINK -->

    <div class="home-link">

        <a href="index.html">

            ← Back to Home

        </a>

    </div>


</div>



<script>


    // Get login form

    const loginForm =
        document.getElementById(
            "loginForm"
        );


    // Login button click

    loginForm.addEventListener(
        "submit",
        function(event) {


            // Prevent page refresh

            event.preventDefault();


            // Get entered email

            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            // Get entered password

            const password =
                document.getElementById(
                    "password"
                ).value;


            // Get message area

            const message =
                document.getElementById(
                    "message"
                );


            // Get registered user

            const savedUser =
                localStorage.getItem(
                    "freshCartUser"
                );


            // Check whether user exists

            if (!savedUser) {

                message.innerText =
                    "❌ No account found. Please register first.";

                message.style.color =
                    "red";

                return;

            }


            // Convert saved data into object

            const user =
                JSON.parse(savedUser);


            // Check email and password

            if (
                email === user.email &&
                password === user.password
            ) {


                // Save login status

                localStorage.setItem(
                    "freshCartLoggedIn",
                    "true"
                );


                message.innerText =
                    "✅ Login successful!";

                message.style.color =
                    "green";


                // Go to home page

                setTimeout(function() {

                    window.location.href =
                        "index.html";

                }, 1000);


            }

            else {

                message.innerText =
                    "❌ Incorrect email or password.";

                message.style.color =
                    "red";

            }

        }

    );

</script>


</body>

</html>
