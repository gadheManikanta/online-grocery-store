<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshCart - Admin Orders</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f5;
            padding: 25px;
        }

        header {
            background: #198754;
            color: white;
            padding: 22px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-buttons a,
        .header-buttons button {
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            background: white;
            color: #198754;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .header-buttons .logout-btn {
            background: #dc3545;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 11px 16px;
            border-radius: 6px;
            background: #198754;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #126b40;
        }

        .order-card {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 9px rgba(0,0,0,0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .order-info {
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .products {
            background: #f4f8f4;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            line-height: 1.8;
        }

        .status-area {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .delete-btn {
            background: #dc3545;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

        .total {
            color: #198754;
            font-size: 18px;
            font-weight: bold;
        }

        .message {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 10px;
        }

        @media(max-width: 600px) {
            body {
                padding: 12px;
            }

            .status-area {
                align-items: stretch;
                flex-direction: column;
            }

            .status-area button,
            .status-area select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>

            <div class="header-top">

                <div>
                    <h1>🛒 FreshCart Admin</h1>
                    <p>Customer Order Management</p>
                </div>

                <div class="header-buttons">

                    <a href="admin-dashboard.html">
                        🏠 Dashboard
                    </a>

                    <button class="logout-btn" onclick="logout()">
                        🚪 Logout
                    </button>

                </div>

            </div>

        </header>

        <div class="top-bar">

            <h2>All Customer Orders</h2>

            <button onclick="loadOrders()">
                🔄 Refresh Orders
            </button>

        </div>

        <div id="ordersContainer">
            <div class="message">Loading orders...</div>
        </div>

    </div>

    <script>

        // =========================================
        // API CONFIGURATION
        // =========================================

        const API_URL = "http://localhost:5000/api/orders";

        const ordersContainer =
            document.getElementById("ordersContainer");


        // =========================================
        // JWT AUTHENTICATION CHECK
        // =========================================

        function getAdminToken() {

            return localStorage.getItem("freshCartAdminToken");

        }


        function checkAdminLogin() {

            const token = getAdminToken();

            if (!token) {

                alert("Please login as administrator.");

                window.location.replace("admin-login.html");

                return false;

            }

            return true;

        }


        if (!checkAdminLogin()) {

            throw new Error("Admin login required.");

        }


        // =========================================
        // API REQUEST HELPER
        // AUTOMATICALLY ATTACHES JWT TOKEN
        // =========================================

        async function adminFetch(url, options = {}) {

            const token = getAdminToken();

            if (!token) {

                logout();

                throw new Error("Please login again.");

            }

            const response = await fetch(url, {

                ...options,

                headers: {

                    ...(options.headers || {}),

                    "Authorization": "Bearer " + token

                }

            });


            // CHECK TOKEN EXPIRATION OR INVALID ACCESS

            if (
                response.status === 401 ||
                response.status === 403
            ) {

                alert(
                    "Your admin session is invalid or expired. Please login again."
                );

                logout();

                throw new Error("Authentication failed.");

            }

            return response;

        }


        // =========================================
        // LOAD ALL ORDERS FROM MONGODB
        // =========================================

        async function loadOrders() {

            ordersContainer.innerHTML = `
                <div class="message">Loading orders...</div>
            `;

            try {

                const response = await adminFetch(API_URL);

                if (!response.ok) {

                    throw new Error("Unable to load orders.");

                }

                const orders = await response.json();

                if (!Array.isArray(orders) || orders.length === 0) {

                    ordersContainer.innerHTML = `
                        <div class="message">
                            <h3>No Orders Found</h3>
                            <p>Customer orders will appear here.</p>
                        </div>
                    `;

                    return;

                }

                displayOrders(orders);

            } catch (error) {

                console.error("Load Orders Error:", error);

                if (error.message !== "Authentication failed.") {

                    ordersContainer.innerHTML = `
                        <div class="message">
                            <h3>Unable to load orders</h3>
                            <p>${escapeHTML(error.message)}</p>
                            <p>Check whether your backend server is running.</p>
                        </div>
                    `;

                }

            }

        }


        // =========================================
        // DISPLAY ORDERS
        // =========================================

        function displayOrders(orders) {

            ordersContainer.innerHTML = orders.map(order => {

                const mongoId = String(order._id || "");

                const orderId = String(order.orderId || "");

                const currentStatus = order.status || "Order Placed";

                const itemsHTML = (order.items || []).map(item => `

                    <p>
                        ${escapeHTML(item.name)}
                        - ₹${Number(item.price || 0).toFixed(2)}
                        × ${Number(item.quantity || 0)}
                    </p>

                `).join("");


                return `

                    <div class="order-card">

                        <div class="order-header">

                            <h3>
                                Order ID: ${escapeHTML(orderId)}
                            </h3>

                            <strong>
                                ${escapeHTML(currentStatus)}
                            </strong>

                        </div>


                        <div class="order-info">

                            <p>
                                <b>Customer:</b>
                                ${escapeHTML(order.customerName)}
                            </p>

                            <p>
                                <b>Phone:</b>
                                ${escapeHTML(order.phone)}
                            </p>

                            <p>
                                <b>Address:</b>
                                ${escapeHTML(order.address)}
                            </p>

                            <p>
                                <b>Delivery Date:</b>
                                ${escapeHTML(order.deliveryDate)}
                            </p>

                            <p>
                                <b>Payment:</b>
                                ${escapeHTML(order.paymentMethod)}
                            </p>

                        </div>


                        <div class="products">

                            <h4>Ordered Products</h4>

                            ${itemsHTML}

                        </div>


                        <p>
                            Subtotal:
                            ₹${Number(order.subtotal || 0).toFixed(2)}
                        </p>

                        <p>
                            Discount:
                            ₹${Number(order.discount || 0).toFixed(2)}
                        </p>

                        <p class="total">
                            Final Total:
                            ₹${Number(order.finalTotal || 0).toFixed(2)}
                        </p>


                        <div class="status-area">

                            <label for="status-${escapeHTML(mongoId)}">
                                Update Status:
                            </label>


                            <select id="status-${escapeHTML(mongoId)}">

                                <option value="Order Placed"
                                    ${currentStatus === "Order Placed" ? "selected" : ""}>
                                    Order Placed
                                </option>

                                <option value="Processing"
                                    ${currentStatus === "Processing" ? "selected" : ""}>
                                    Processing
                                </option>

                                <option value="Shipped"
                                    ${currentStatus === "Shipped" ? "selected" : ""}>
                                    Shipped
                                </option>

                                <option value="Out for Delivery"
                                    ${currentStatus === "Out for Delivery" ? "selected" : ""}>
                                    Out for Delivery
                                </option>

                                <option value="Delivered"
                                    ${currentStatus === "Delivered" ? "selected" : ""}>
                                    Delivered
                                </option>

                                <option value="Cancelled"
                                    ${currentStatus === "Cancelled" ? "selected" : ""}>
                                    Cancelled
                                </option>

                            </select>


                            <button
                                onclick="updateOrderStatus('${escapeHTML(orderId)}', '${escapeHTML(mongoId)}')">

                                Update Status

                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteOrder('${escapeHTML(orderId)}')">

                                Delete Order

                            </button>

                        </div>

                    </div>

                `;

            }).join("");

        }


        // =========================================
        // UPDATE ORDER STATUS
        // JWT TOKEN REQUIRED
        // =========================================

        async function updateOrderStatus(orderId, mongoId) {

            const statusElement =
                document.getElementById("status-" + mongoId);

            const selectedStatus = statusElement.value;

            try {

                const response = await adminFetch(

                    API_URL + "/" + encodeURIComponent(orderId),

                    {

                        method: "PUT",

                        headers: {

                            "Content-Type": "application/json"

                        },

                        body: JSON.stringify({

                            status: selectedStatus

                        })

                    }

                );


                const data = await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.message || "Status update failed."
                    );

                }

                alert("Order status updated successfully! ✅");

                await loadOrders();

            } catch (error) {

                console.error("Update Order Error:", error);

                if (error.message !== "Authentication failed.") {

                    alert(
                        "Error updating status: " + error.message
                    );

                }

            }

        }


        // =========================================
        // DELETE ORDER
        // JWT TOKEN REQUIRED
        // =========================================

        async function deleteOrder(orderId) {

            if (!confirm("Are you sure you want to delete this order?")) {

                return;

            }

            try {

                const response = await adminFetch(

                    API_URL + "/" + encodeURIComponent(orderId),

                    {

                        method: "DELETE"

                    }

                );


                const data = await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.message || "Delete failed."
                    );

                }

                alert("Order deleted successfully! 🗑️");

                await loadOrders();

            } catch (error) {

                console.error("Delete Order Error:", error);

                if (error.message !== "Authentication failed.") {

                    alert(
                        "Error deleting order: " + error.message
                    );

                }

            }

        }


        // =========================================
        // ESCAPE HTML VALUES
        // =========================================

        function escapeHTML(value) {

            return String(value ?? "").replace(/[&<>"']/g, character => {

                const entities = {

                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"

                };

                return entities[character];

            });

        }


        // =========================================
        // ADMIN LOGOUT
        // =========================================

        function logout() {

            localStorage.removeItem("freshCartAdminToken");

            localStorage.removeItem("freshCartAdmin");

            localStorage.removeItem("freshCartAdminLoggedIn");

            alert("You have logged out successfully.");

            window.location.replace("admin-login.html");

        }


        // =========================================
        // LOAD ORDERS WHEN PAGE OPENS
        // =========================================

        window.addEventListener("DOMContentLoaded", loadOrders);

    </script>

</body>

</html>
