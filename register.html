<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FreshCart - Register</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #dff7df,
                    #fff3d6
                );

            padding: 20px;
        }

        .register-container {
            width: 100%;

            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;

            font-size: 30px;

            font-weight: bold;

            color: #159447;

            margin-bottom: 10px;
        }

        .title {
            text-align: center;

            font-size: 25px;

            color: #222;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        .form-group input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d5d5d5;

            border-radius: 8px;

            outline: none;

            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #159447;

            box-shadow:
                0 0 5px
                rgba(21, 148, 71, 0.2);
        }

        .register-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #159447;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .register-button:hover {
            background: #0e7536;
        }

        .login-link {
            text-align: center;

            margin-top: 20px;

            color: #666;

            font-size: 14px;
        }

        .login-link a {
            color: #159447;

            font-weight: bold;

            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .message {
            text-align: center;

            margin-top: 15px;

            font-weight: bold;
        }

        @media (max-width: 500px) {

            .register-container {
                padding: 25px;
            }

            .logo {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<div class="register-container">


    <!-- LOGO -->

    <div class="logo">

        🛒 FreshCart

    </div>


    <!-- TITLE -->

    <h1 class="title">

        Create Account

    </h1>


    <p class="subtitle">

        Register to start shopping on ayyappa fresh-store

    </p>


    <!-- REGISTRATION FORM -->

    <form id="registerForm">


        <!-- NAME -->

        <div class="form-group">

            <label for="name">

                Full Name

            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">

                Email Address

            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <!-- PHONE -->

        <div class="form-group">

            <label for="phone">

                Phone Number

            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">

                Password

            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label for="confirmPassword">

                Confirm Password

            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
            >

        </div>


        <!-- REGISTER BUTTON -->

        <button
            type="submit"
            class="register-button">

            Create Account

        </button>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">
        </div>


    </form>


    <!-- LOGIN LINK -->

    <div class="login-link">

        Already have an account?

        <a href="login.html">

            Login

        </a>

    </div>


</div>



<script>

    // Get registration form

    const registerForm =
        document.getElementById(
            "registerForm"
        );


    registerForm.addEventListener(
        "submit",
        function(event) {

            // Stop page refresh

            event.preventDefault();


            // Get input values

            const name =
                document.getElementById(
                    "name"
                ).value.trim();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const phone =
                document.getElementById(
                    "phone"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            const confirmPassword =
                document.getElementById(
                    "confirmPassword"
                ).value;


            const message =
                document.getElementById(
                    "message"
                );


            // Check passwords

            if (password !== confirmPassword) {

                message.innerText =
                    "❌ Passwords do not match.";

                message.style.color =
                    "red";

                return;

            }


            // Create user object

            const user = {

                name: name,

                email: email,

                phone: phone,

                password: password

            };


            // Save user information

            localStorage.setItem(
                "freshCartUser",
                JSON.stringify(user)
            );


            // Success message

            message.innerText =
                "✅ Registration successful!";

            message.style.color =
                "green";


            // Clear form

            registerForm.reset();


            // Go to login page after 1.5 seconds

            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1500);

        }

    );

</script>


</body>

</html>
